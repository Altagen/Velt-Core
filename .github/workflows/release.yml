name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # Build & Verify
  # ===========================================
  build:
    name: 🔨 Build & Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

      - name: Pack npm package
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
          retention-days: 30

  # ===========================================
  # Generate SBOM for Release
  # ===========================================
  sbom:
    name: 📋 Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom-${{ needs.build.outputs.version }}.json
          npx @cyclonedx/cyclonedx-npm --output-format XML --output-file sbom-${{ needs.build.outputs.version }}.xml

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-release
          path: sbom-*
          retention-days: 90

  # ===========================================
  # Generate Checksums
  # ===========================================
  checksums:
    name: 🔐 Generate Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Generate checksums
        run: |
          sha256sum *.tgz > SHA256SUMS.txt
          sha512sum *.tgz > SHA512SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            SHA256SUMS.txt
            SHA512SUMS.txt
          retention-days: 90

  # ===========================================
  # Generate Changelog
  # ===========================================
  changelog:
    name: 📝 Generate Changelog
    runs-on: ubuntu-latest
    needs: build
    outputs:
      notes: ${{ steps.read.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: Append install & verification footer
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          cat >> CHANGELOG_RELEASE.md << EOF

          ---

          ### 📦 Installation

          \`\`\`bash
          npm install @altagen/velt-core@${VERSION}
          \`\`\`

          ### 🔐 Security

          SBOM (Software Bill of Materials) and SHA256/SHA512 checksums are attached to this release.

          \`\`\`bash
          # Verify package integrity
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

      - name: Read notes
        id: read
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG_RELEASE.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ===========================================
  # Create GitHub Release
  # ===========================================
  github-release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, checksums, changelog, sbom]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ needs.build.outputs.version }}"
          body: ${{ needs.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            artifacts/npm-package/*.tgz
            artifacts/checksums/*.txt
            artifacts/sbom-release/*
          generate_release_notes: false

  # ===========================================
  # Publish to npm
  # ===========================================
  npm-publish:
    name: 📤 Publish to npm
    runs-on: ubuntu-latest
    needs: [build, github-release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
